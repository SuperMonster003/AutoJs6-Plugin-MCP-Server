[versions]

appcompat = "1.7.1"
commons-compress = "1.28.0"
# The Compose host activity of the release history page; the BOM does not manage it (the other official plugins get
# it aligned through activity-ktx 1.12.2).
activity-compose = "1.12.2"
# Jetpack Compose for the release history page (plugin-center P21.8, Q115 A): the BOM of the other official plugins
# (Compose 1.12 line, compileSdk 37).
compose-bom = "2026.09.00"
foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
ktor = "3.5.1"
material = "1.13.0"
mcp-kotlin-sdk = "0.15.0"
# The real org.json for the JVM tests of the settings transfer document (android.jar only has stubs); the version the host
# tests common-plugin-api with (roadmap P13).
org-json = "20231013"
zxing = "3.5.4"
# Compose UI tests pull Espresso 3.5.0, whose idling sync reflects on InputManager.getInstance (gone on API 36).
test-espresso-core = "3.7.0"
test-junit-version = "1.3.0"
test-rules = "1.7.0"
test-runner = "1.7.0"
xz = "1.10"

[libraries]

apache-commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
junit = { module = "junit:junit", version.ref = "junit" }
ktor-bom = { module = "io.ktor:ktor-bom", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host" }
material = { module = "com.google.android.material:material", version.ref = "material" }
mcp-kotlin-sdk-server = { module = "io.modelcontextprotocol:kotlin-sdk-server", version.ref = "mcp-kotlin-sdk" }
org-json = { module = "org.json:json", version.ref = "org-json" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "test-espresso-core" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit-version" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
tukaani-xz = { module = "org.tukaani:xz", version.ref = "xz" }

[plugins]

foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
